<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXORA | Workspace</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
</head>

<body>

    <main class="welcome-page">

        <section class="welcome-card">

            <span class="logo-mark">N</span>

            <h1>Hi, {{ user["name"] }}</h1>
            <p>You're signed in as {{ user["email"] }}.</p>

            <form method="post" action="{{ url_for('logout') }}">
                <button type="submit" class="submit-btn">Log out</button>
            </form>

        </section>

    </main>

</body>
</html>
